version: 2
project_name: crowdsec-gram-bot
builds:
  - main: .
    binary: crowdsec-gram-bot
    env: [CGO_ENABLED=0]
    goos: [linux]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    mod_timestamp: "{{.CommitTimestamp}}"
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.ShortCommit}} -X main.date={{.CommitDate}}
archives:
  - formats: [binary]
checksum:
  name_template: checksums.txt
signs:
  - artifacts: checksum
    cmd: openssl
    args: [pkeyutl, -sign, -rawin, -inkey, "{{ .Env.SIGNING_KEY_FILE }}", -passin, stdin, -in, "${artifact}", -out, "${signature}"]
    stdin: "{{ .Env.SIGNING_PASSPHRASE }}"
    signature: "${artifact}.sig"
release:
  github:
    owner: carvalab
    name: crowdsec-gram-bot
